</head><body><main><a href="/">RecruitCloud</a><h1>Book a build session</h1>
<p>Continue to enter your booking email and choose whether to allow advertising measurement.</p><p><a id="consent-booking" href="https://script.google.com/macros/s/AKfycbxKQItNCn6qL0IHzX72kdlnktR9VO-DSSjTuOKgJWOUCp0RHFBJm_Sl1wLwZuQ-clTT/exec">Continue to book your call</a></p><p><a href="https://calendar.app.google/mDTWSMweocZYaitr9">Book without advertising measurement</a></p></main><script>
(function () {
  var link = document.getElementById('consent-booking');
  var destination = new URL(link.href);
  var query = new URLSearchParams(location.search);
  if (!navigator.globalPrivacyControl) {
    ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','oppref'].forEach(function (key) {
      var value = query.get(key);
      if (value && value.length <= 1024) destination.searchParams.set(key, value);
    });
  }
  link.href = destination.href;
}());
</script></body></html>
